name: remote_ctrl
description: "RemoteHub mobile – remote controller and monitor for paired desktop PCs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # HTTP / networking
  dio: ^5.7.0
  http: ^1.6.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^1.2.0

  # Local notifications (temp alerts)
  flutter_local_notifications: ^18.0.1

  # Background service (keep WebSocket alive on Android)
  flutter_background_service: ^5.0.12

  # Settings persistence
  shared_preferences: ^2.3.5

  # Utilities
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
